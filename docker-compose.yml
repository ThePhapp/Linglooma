services:
  backend:
    build:
      context: ./01-backend-nodejs
    env_file:
      - path: ./01-backend-nodejs/.env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-your_local_database_password}
      DB_NAME: linglooma
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./00-frontend-react
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_local_database_password}
      POSTGRES_DB: linglooma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linglooma"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./02-database-postgresql/linglooma_update.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  db_data:
